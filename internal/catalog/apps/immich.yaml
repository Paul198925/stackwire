id: immich
name: Immich
category: photos
description: Photo and video backup with apps for your phone
# Server and machine learning must run the same version. v3 follows the
# current major release, as Immich's own setup does.
image: ghcr.io/immich-app/immich-server:v3
port: 2283
health: /api/server/ping
secrets:
  IMMICH_DB_PASSWORD: password
env:
  DB_HOSTNAME: immich-database
  DB_USERNAME: postgres
  DB_PASSWORD: ${IMMICH_DB_PASSWORD}
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: immich-redis
  IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
volumes:
  - data/photos:/data
dataDirs:
  - photos
sidecars:
  - name: machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3
    volumes:
      - volume/model-cache:/cache
  - name: redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
  - name: database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - volume/database:/var/lib/postgresql/data
    shmSize: 128mb
todo: Install the Immich app on your phone and sign in with the server address and the admin email shown above.
driver: immich
