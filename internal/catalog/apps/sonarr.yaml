id: sonarr
name: Sonarr
category: media
description: TV show manager
image: lscr.io/linuxserver/sonarr:latest
port: 8989
health: /ping
secrets:
  SONARR_API_KEY: hex32
env:
  SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
volumes:
  - config:/config
  - data:/data
dataDirs:
  - media/tv
  - torrents/tv
driver: arr
arr:
  apiVersion: v3
  apiKeySecret: SONARR_API_KEY
  rootFolder: /data/media/tv
  category: tv
  prowlarrApp: Sonarr
  seerr: sonarr
  counts:
    - label: Series
      path: /series
    - label: Missing episodes
      path: /wanted/missing?pageSize=1
      field: totalRecords
    - label: In download queue
      path: /queue?pageSize=1
      field: totalRecords
